
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Advanced Course Registration Form</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(to right, #0657ee, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container{
            width: 700px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
             animation: float 2s infinite;

        }
        @keyframes float{
    50%{transform: translateX(8px); }
    50%{transform: translatey(8px); }
}

        h1{
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .subtitle{
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        form{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full{
            grid-column: span 2;
        }

        label{
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #243b55;
        }

        input,
        select,
        textarea{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color: #243b55;
            box-shadow: 0 0 5px #243b55;
        }

        textarea{
            resize: none;
            height: 100px;
        }

        .courses{
            display: grid;
            grid-template-columns: 1fr 1fr;
            
            margin-top: 10px;
        }

        .courses label{
            font-weight: normal;
        }

        .gender,
        .payment{
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .btn{
            grid-column: span 2;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #243b55;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover{
            background: #141e30;
        }

        .footer{
            text-align: center;
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Course Registration Form</h1>
        <p class="subtitle">
            Fill all required information to register for your preferred course.
        </p>

        <form>

            <div>
                <label>First Name</label>
                <input type="text" placeholder="Enter first name" required>
            </div>

            <div>
                <label>Last Name</label>
                <input type="text" placeholder="Enter last name" required>
            </div>

            <div>
                <label>Email Address</label>
                <input type="email" placeholder="Enter email" required>
            </div>

            <div>
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number" required>
            </div>

            <div>
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

          <div>
    <label>Nationality</label>

    <select required>
        <option value="">Select Nationality</option>

        <option>Rwandan</option>
        <option>Ugandan</option>
        <option>Kenyan</option>
        <option>Tanzanian</option>
        <option>Burundian</option>
        <option>Congolese</option>
        <option>Nigerian</option>
        <option>Ghanaian</option>
        <option>South African</option>
        <option>Egyptian</option>
        
        <option>Other</option>
    </select>
</div>

            <div class="full">
                <label>Gender</label>

                <div class="gender">
                    <label><input type="radio" name="gender"> Male</label>
                    <label><input type="radio" name="gender"> Female</label>
                    
                </div>
            </div>

            <div class="full">
                <label>Select Courses</label>

                <div class="courses">

                    <label><input type="checkbox"> Web Development</label>
                    <label><input type="checkbox"> Develop Game in Vue Framework</label>
                    <label><input type="checkbox"> Networking and Internet Technology</label>
                    <label><input type="checkbox"> UX Design</label>
                    <label><input type="checkbox"> Database Development</label>
                    <label><input type="checkbox"> Graphic Design</label>
                    <label><input type="checkbox"> Javascript Fundamentals</label>
                    <label><input type="checkbox"> Version Control</label>
                    

                </div>
            </div>

            <div>
                <label>Education Level</label>
                <select>
                    <option>Select Level</option>
                    <option>High School</option>
                    <option>Diploma</option>
                    <option>Bachelor Degree</option>
                    <option>Master Degree</option>
                </select>
            </div>

            <div>
                <label>Training Shift</label>
                <select>
                    <option>Select Shift</option>
                    <option>Morning</option>
                    <option>Afternoon</option>
                    <option>Evening</option>
                    <option>Day</option>
                </select>
            </div>

            <div class="full">
                <label>Payment Method</label>

                <div class="payment">
                    <label><input type="radio" name="pay"> Cash</label>
                    <label><input type="radio" name="pay"> Bank</label>
                    <label><input type="radio" name="pay"> Mobile Money</label>
                </div>
            </div>

         

            <div>
                <label>Registration Date</label>
                <input type="date" required>
            </div>

            <div class="full">
                <label>Home Address</label>
                <textarea placeholder="Enter full address" required></textarea>
            </div>

            <div class="full">
                <label>Why do you want to join this course?</label>
                <textarea placeholder="Write your motivation here..." required></textarea>
            </div>

            <button type="submit" class="btn">
                Submit Registration
            </button>

        </form>

        <div class="footer">
            © 2026 Innovate Company LTD | All Rights Reserved
        </div>

    </div>

</body>
</html>
