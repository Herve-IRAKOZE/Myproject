<!DOCTYPE html>
<html lang="en">
<head>
    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to right,#2b49f3,#4682f2);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    box-shadow: black;
}

.Box{
    width:500px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0  20px rgba(0,0,0,0.2);
    animation: float 2s infinite;
     


}
@keyframes float{
    50%{transform: translateX(8px); }
    50%{transform: translatey(8px); }
}

.container h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.input-box{
    margin-bottom:15px;
}

.input-box label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    color:#444;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

textarea{
    resize:none;
    height:80px;
}

.gender{
    display:flex;
    margin-top:5px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#008cdd;
}

</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form </title>
</head>
<body>

<div class="Box">

    <h2>Student Registration Form</h2>

    <form>

        <div class="input-box">
            <label>First Name</label>
            <input type="text" placeholder="Enter first name" required>
        </div>

        <div class="input-box">
            <label>Last Name</label>
            <input type="text" placeholder="Enter last name" required>
        </div>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" placeholder="Enter email" required>
        </div>

        <div class="input-box">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>
        </div>

        <div class="input-box">
            <label>Date of Birth</label>
            <input type="date" required>
        </div>

        <div class="input-box">
            <label>Gender</label>

            <div class="gender">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                
            </div>

        </div>

        <div class="input-box">
            <label>Student ID</label>
            <input type="text" placeholder="Enter student ID">
        </div>

        <div class="input-box">
            <label>Trade</label>
            <select required>
                <option value="">Select Department/Trade</option>
                <option>Software Development</option>
                <option>Networking and Internet Technology</option>
                <option>Computer System and Architecture</option>
               
            </select>
        </div>
        <div class="input-box">
            <label>Year of Study</label>
            <select>
                <option>Level 3</option>
                <option>Level 4</option>
                <option>Level 5</option>
                
                
            </select><br><br>

        <div class="input-box">
            <label>Address</label>
            <textarea placeholder="Enter your address"></textarea>
            <label>Parent/Guardian Name</label>
            <input type="text" placeholder="Enter guardian name">
            <label>Parent Phone Number</label>
            <input type="tel" placeholder="Enter guardian phone">
            
        </div>

        <button type="submit">Register Student</button>

    </form>

</div>
</body>
</html>
