
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Library Book Registration</title>

<style>    
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #62a9c8, #33a0c5, #047bae);
    margin: 0;
    padding: 20px;
}

.container{
    max-width: 700px;
    background: linear-gradient(white);;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
}

h1{
    text-align: center;
    color: #2c5364;
    font-family:  Georgia, 'Times New Roman', Times, serif;
}

p{
    text-align: center;
    color: gray;
    margin-bottom: 25px;
}

form{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.full{
    grid-column: 1 / 3;
}

label{
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

input,
select,
textarea{
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

textarea{
    resize: none;
}

.radio-group{
    display: flex;
    gap: 20px;
    margin-top: 10px;
}

.radio-group label{
    font-weight: normal;
}

.buttons{
    grid-column: 1 / 3;
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

button{
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn{
    background: #2c5364;
    color: white;
}

.submit-btn:hover{
    background: #1b3947;
}

.reset-btn{
    background: crimson;
    color: white;
}

.reset-btn:hover{
    background: darkred;
}

.back{
    background-color: #68bfe7;
}

.back:hover{
    background: snow;
}

</style>
</head>

<body>

<div class="container">

<h1>School Library Book Registration Form</h1>
<p>Register books received into the school library</p>

<form>

<div>
<label>Book Title</label>
<input type="text" placeholder="Enter book title" required>
</div><br>

<div>
<label>Author Name</label>
<input type="text" placeholder="Enter author name" required>
</div><br>

<div>
<label>ISBN Number</label>
<input type="text" placeholder="Enter ISBN">
</div><br>

<div>
<label>Book Category</label>
<select required>
<option value="">Select Category</option>
<option>Sciences</option>
<option>Mathematics</option>
<option>Computer Science</option>
<option>History</option>
<option>Geography</option>
<option>Literature</option>
<option>Languages</option>
</select>
</div><br>

<div>
<label>Publisher</label>
<input type="text" placeholder="Publisher name">
</div><br>

<div>
<label>Publication Year</label>
<input type="number" placeholder="2026">
</div><br>

<div>
<label>Language</label>
<select>
<option>English</option>
<option>French</option>
<option>Kinyarwanda</option>
<option>Swahili</option>
</select>
</div><br>

<div>
<label>Number of Copies</label>
<input type="number" placeholder="Enter copies">
</div>

<div class="full">
<label>Has the Book Been Received?</label>

<div class="radio-group">
<label>
<input type="radio" name="received"> Yes
</label>

<label>
<input type="radio" name="received"> No
</label>
</div>

</div>

<div class="full">
<label>Date Received</label>
<input type="date">
</div>

<div class="full">
<label>column Location and Row</label>
<input type="text" placeholder="Enter a Location of Book">
</div>

<div class="full">
<label>Book Description</label>
<textarea rows="4" placeholder="Write short description about the book"></textarea>
</div>

<div class="buttons">
<button type="submit" class="submit-btn">Register Book</button>
<button type="reset" class="reset-btn">Reset Form</button>
</div>

<button class="back"><a href="course.html">BACK</a></button>

</form>

</div>

</body>
</html>
