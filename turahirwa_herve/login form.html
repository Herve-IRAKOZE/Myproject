<!DOCTYPE html>
<html lang="en">
<head>
  <style>
          *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f8f8fa,#1e3a8a,#2563eb);
}

.Box{
    width:350px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 25px rgba(0,0,0,0.3);
    animation: float 2s infinite;
}
@keyframes float{
    50%{transform: translateX(8px); }
    50%{transform: translatey(8px); }
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h1{
    color:#1e3a8a;
    font-size:28px;
    font-family: Georgia, 'Times New Roman', Times, serif;
}

.logo p{
    color:rgb(10, 10, 10);
    font-size:14px;
}

form{
    display:flex;
    flex-direction:column;
}

label{
    margin-top:12px;
    margin-bottom:5px;
    color:#333;
    font-weight:bold;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 5px #2563eb;
}

.options{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#2563eb;
}

button{
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e40af;
}

.footer{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.footer a{
    color:#2563eb;
    text-decoration:none;
}
  </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
</head>
<body>
   <div class="Box">

    <div class="logo">
        <h1>Innovate Company LTD</h1>
        
    </div>

    <form action="@">
        
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email/Phone number" required>

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <div class="options">

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

        <div class="footer">
            Don't have an account?
            <a href="registration .html">Register</a>
        </div>
    </div>
    </form>

</body>
</html>
